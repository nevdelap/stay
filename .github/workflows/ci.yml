---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install system tools
        run: scripts/ci-tmux.sh
      - name: Test quality dispatcher
        run: uv run --script scripts/test_quality.py
      - name: Run lint
        run: just --no-deps lint
      - name: Run whole-tree Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build release profile
        run: cargo build --release --locked --all-features
      - name: Dry-run package publication
        run: cargo publish --locked --dry-run
      - name: Run dependency audit
        run: just --no-deps audit
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Verify supported tmux
        run: scripts/ci-tmux.sh --verify
      - name: Run tests
        run: just --no-deps test-nextest
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Check MSRV
        run: just --no-deps msrv
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install tmux and zsh
        run: scripts/ci-tmux.sh
      - name: Build with stable
        run: cargo +stable build --locked --all-targets --all-features
      - name: Verify supported tmux
        run: scripts/ci-tmux.sh --verify
      - name: Test with stable
        run: cargo +stable test --locked --all-targets --all-features
  lint-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Run whole-tree lint
        run: just --no-deps lint all
  macos:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install tmux and zsh
        run: scripts/ci-tmux.sh
      - name: Verify supported tmux
        run: scripts/ci-tmux.sh --verify
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
