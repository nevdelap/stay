---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  nix:
    name: Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            kernel: Linux
            architecture: x86_64
            timeout: 2
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            kernel: Linux
            architecture: aarch64
            timeout: 2
          - system: x86_64-darwin
            runner: macos-15-intel
            kernel: Darwin
            architecture: x86_64
            timeout: 7
          - system: aarch64-darwin
            runner: macos-14
            kernel: Darwin
            architecture: arm64
            timeout: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Nix with flakes
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify native runner
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          EXPECTED_KERNEL: ${{ matrix.kernel }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test "$(uname -s)" = "$EXPECTED_KERNEL"
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          case "$EXPECTED_SYSTEM" in
            x86_64-linux|aarch64-linux) test "$RUNNER_OS" = Linux ;;
            x86_64-darwin|aarch64-darwin) test "$RUNNER_OS" = macOS ;;
            *) echo "unsupported system: $EXPECTED_SYSTEM" >&2; exit 1 ;;
          esac
      - name: Build native Stay packages
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix build \
            ".#packages.${SYSTEM}.stay" \
            ".#packages.${SYSTEM}.default"
      - name: Run native Nix checks
        env:
          SYSTEM: ${{ matrix.system }}
        run: nix flake check --system "$SYSTEM"
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install system tools
        run: scripts/ci-install-tmux.sh
      - name: Test quality dispatcher
        run: uv run --script scripts/test_quality.py
      - name: Run lint
        run: just --no-deps lint
      - name: Run whole-tree Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build release profile
        run: cargo build --release --locked --all-features
      - name: Dry-run package publication
        run: cargo publish --locked --dry-run
      - name: Run dependency audit
        run: just --no-deps audit
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Verify supported tmux
        run: scripts/ci-install-tmux.sh --verify
      - name: Run tests
        run: just --no-deps test-nextest
  acceptance:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 6
          - os: macos-latest
            timeout: 8
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Bash 5 on macOS
        if: runner.os == 'macOS'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix bash)/bin/bash" --version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install tmux and zsh
        run: scripts/ci-install-tmux.sh
      - name: Verify supported tmux
        run: scripts/ci-install-tmux.sh --verify
      - name: Build release profile
        run: cargo build --release --locked --all-features
      - name: Install Bats
        run: scripts/ci-install-bats.sh
      - name: Run Bats acceptance
        run: |
          STAY_BIN="$GITHUB_WORKSPACE/target/release/stay" \
            ACCEPTANCE_ARTIFACT_DIR="$GITHUB_WORKSPACE/acceptance-artifacts" \
            scripts/ci-run-acceptance.sh
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-diagnostics-${{ matrix.os }}
          path: acceptance-artifacts
          if-no-files-found: warn
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install tmux and zsh
        run: scripts/ci-install-tmux.sh
      - name: Verify supported tmux
        run: scripts/ci-install-tmux.sh --verify
      - name: Check MSRV
        run: just --no-deps msrv
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install tmux and zsh
        run: scripts/ci-install-tmux.sh
      - name: Build with stable
        run: cargo +stable build --locked --all-targets --all-features
      - name: Verify supported tmux
        run: scripts/ci-install-tmux.sh --verify
      - name: Test with stable
        run: cargo +stable test --locked --all-targets --all-features
  lint-all:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Run whole-tree lint
        run: just --no-deps lint all
  macos:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install tmux and zsh
        run: scripts/ci-install-tmux.sh
      - name: Verify supported tmux
        run: scripts/ci-install-tmux.sh --verify
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
